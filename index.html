<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red News — Red County, San Andreas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400;1,8..60,600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#08080a;color:#f2f2ee;font-family:'Source Serif 4',serif;min-height:100vh}
a{text-decoration:none;color:inherit}
button{cursor:pointer}
input,textarea,select{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #ff3a3a;outline-offset:3px}
@keyframes rn-ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes rn-pulse{0%,100%{opacity:1}50%{opacity:0.25}}
@keyframes rn-ripple{0%{box-shadow:0 0 0 0 rgba(204,0,0,0.5)}70%{box-shadow:0 0 0 20px rgba(204,0,0,0)}100%{box-shadow:0 0 0 0 rgba(204,0,0,0)}}

.util-strip{display:flex;align-items:center;justify-content:space-between;padding:8px 40px;background:#0c0c0e;border-bottom:1px solid #1c1c20;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#7a7a82}
.util-strip .left{display:flex;align-items:center;gap:8px;text-transform:uppercase}
.util-strip .right{display:flex;align-items:center;gap:20px}
.util-live{display:flex;align-items:center;gap:7px;color:#ff3a3a}
.util-live .dot{width:7px;height:7px;border-radius:50%;background:#ff2a2a;box-shadow:0 0 8px #ff2a2a;animation:rn-pulse 1.3s ease-in-out infinite}
.util-item{display:flex;align-items:center;gap:6px}

.masthead{display:flex;align-items:center;justify-content:space-between;gap:30px;padding:26px 40px;background:linear-gradient(120deg,#0d0303 0%,#150505 50%,#0b0203 100%);border-bottom:1px solid #240a0a;position:relative;overflow:hidden;min-height:152px}
.masthead-map{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.masthead-map img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 50%;opacity:.92}
.masthead-map .g1{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,2,2,.93) 0%,rgba(10,2,2,.42) 28%,rgba(8,2,2,.3) 55%,rgba(11,2,2,.78) 82%,rgba(9,2,2,.95) 100%)}
.masthead-map .g2{position:absolute;inset:0;background:linear-gradient(0deg,rgba(8,2,2,.62) 0%,transparent 42%,transparent 70%,rgba(8,2,2,.5) 100%)}
.map-dot{position:absolute;transform:translate(-50%,-50%)}
.map-dot-inner{display:block;border-radius:50%}
.map-dot-ring{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 0 rgba(204,0,0,.65);animation:rn-ripple 2.4s ease-out infinite}
.masthead-wm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none;user-select:none;z-index:1;text-align:center}
.masthead-logo{display:flex;align-items:center;gap:16px;position:relative;z-index:2}
.mast-badge{width:66px;height:66px;border-radius:12px;overflow:hidden;background:#000;border:1px solid #2e0c0c;box-shadow:0 0 30px rgba(204,0,0,.4);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mast-badge img{width:100%;height:100%;object-fit:contain;display:block}
.mast-title{font-family:'Oswald',sans-serif;font-weight:700;font-size:42px;line-height:.92;letter-spacing:1px;font-style:italic}
.mast-sub{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:5px;color:#6a4a4a;text-transform:uppercase;margin-top:5px}
.mast-search{display:flex;align-items:center;background:#0a0a0c;border:1px solid #2c2c32;border-radius:8px;overflow:hidden;width:340px;max-width:38%;position:relative;z-index:2}
.mast-search input{flex:1;background:transparent;border:none;outline:none;color:#f2f2ee;font-size:14px;padding:11px 15px}
.mast-search button{background:#cc0000;border:none;color:#fff;padding:0 16px;align-self:stretch;display:flex;align-items:center;transition:background .15s}
.mast-search button:hover{background:#ff2a2a}

.info-bar{display:flex;align-items:stretch;background:#0c0c0e;border-top:1px solid #1c1c20;border-bottom:1px solid #1c1c20;overflow-x:auto}
.info-tile{display:flex;align-items:center;gap:13px;padding:13px 24px;border-right:1px solid #18181c;flex:1;min-width:200px}
.info-tile:last-child{border-right:none}
.tile-icon{color:#cc0000;display:flex;flex-shrink:0}
.tile-name{font-family:'Oswald',sans-serif;font-weight:600;font-size:12.5px;letter-spacing:1.5px;color:#dcdcd6;text-transform:uppercase}
.tile-status{display:flex;align-items:center;gap:7px;margin-top:4px;font-family:'Share Tech Mono',monospace;font-size:11px;color:#8a8a8a}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dg{background:#2ec27a}.dy{background:#f5a01a}.dr{background:#ff3a3a}
.route-badge{flex-shrink:0;width:32px;height:23px;border-radius:4px;background:#cc0000;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-weight:700;font-size:13px;color:#fff}

.site-nav{display:flex;align-items:stretch;background:#101012;border-bottom:1px solid #1f1f24;padding:0 30px}
.site-nav a{font-family:'Oswald',sans-serif;font-weight:600;font-size:13.5px;letter-spacing:2px;text-transform:uppercase;color:#a8a8ae;padding:14px 22px;display:flex;align-items:center;gap:9px;transition:color .15s}
.site-nav a:hover{color:#fff}
.site-nav a.active{color:#fff;background:#cc0000}

.compact-hdr{display:flex;align-items:center;justify-content:space-between;gap:30px;padding:16px 40px;background:linear-gradient(120deg,#0d0303,#0b0203);border-bottom:1px solid #240a0a}
.compact-logo{display:flex;align-items:center;gap:13px}
.compact-badge{width:46px;height:46px;border-radius:9px;overflow:hidden;background:#000;border:1px solid #2e0c0c;box-shadow:0 0 22px rgba(204,0,0,.4);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.compact-badge img{width:100%;height:100%;object-fit:contain;display:block}
.compact-title{font-family:'Oswald',sans-serif;font-weight:700;font-size:26px;font-style:italic;letter-spacing:.5px;white-space:nowrap}
.compact-nav{display:flex;align-items:center;gap:8px}
.compact-nav a{font-family:'Oswald',sans-serif;font-weight:600;font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;color:#a8a8ae;padding:8px 14px;border-radius:5px;transition:color .15s}
.compact-nav a:hover{color:#fff}
.compact-nav a.active{color:#fff;background:#cc0000}

.ticker{display:flex;align-items:stretch;background:#cc0000;overflow:hidden}
.ticker-lbl{background:#08080a;color:#ff2a2a;font-family:'Oswald',sans-serif;font-weight:700;font-size:12px;letter-spacing:3px;padding:9px 30px 9px 20px;display:flex;align-items:center;flex-shrink:0;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.ticker-track{flex:1;overflow:hidden;display:flex;align-items:center}
.ticker-inner{display:flex;white-space:nowrap;animation:rn-ticker 38s linear infinite;font-family:'Oswald',sans-serif;font-weight:500;font-size:13px;letter-spacing:.8px;color:#fff;text-transform:uppercase}
.ticker-inner .ti{padding:0 26px}
.ticker-inner .ts{opacity:.5}

.hero-grid{display:grid;grid-template-columns:1fr 372px;gap:26px;padding:30px 40px 14px;max-width:1280px;margin:0 auto}
.lead-card{position:relative;height:640px;border-radius:8px;overflow:hidden;border:1px solid #241010;background:#0c0202;cursor:pointer}
.lead-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 42%}
.lead-tags{position:absolute;top:16px;left:16px;display:flex;gap:8px;z-index:1}
.tag-cat{background:#cc0000;color:#fff;font-family:'Oswald',sans-serif;font-weight:700;font-size:11px;letter-spacing:2px;padding:5px 12px;border-radius:3px;text-transform:uppercase}
.tag-live{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.72);border:1px solid #cc0000;color:#ff3a3a;font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:1.5px;padding:5px 10px;border-radius:3px;text-transform:uppercase}
.tag-live .dot{width:6px;height:6px;border-radius:50%;background:#ff2a2a;animation:rn-pulse 1.3s infinite}
.lead-overlay{position:absolute;left:0;right:0;bottom:0;padding:34px 28px 24px;background:linear-gradient(0deg,rgba(0,0,0,.86) 0%,rgba(0,0,0,.48) 46%,transparent 82%);z-index:1}
.lead-overlay h2{font-family:'Oswald',sans-serif;font-weight:700;font-size:38px;line-height:1.02;letter-spacing:.3px;color:#fff;text-transform:uppercase;max-width:780px}
.lead-dek{font-family:'Source Serif 4',serif;font-size:15.5px;line-height:1.55;color:#d6d6d0;margin-top:12px;max-width:680px}
.lead-meta{display:flex;align-items:center;gap:16px;margin-top:14px;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:1px;color:#a6a6a0;text-transform:uppercase}
.lead-meta span{display:flex;align-items:center;gap:6px}
.lead-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#4a1c1c}
.lead-no-img{height:auto!important;min-height:unset!important}
.lead-no-img .lead-tags{position:relative;top:auto;left:auto;padding:20px 22px 0;display:flex;gap:8px}
.lead-no-img .lead-overlay{position:relative;background:none;padding:16px 22px 22px}

.side-col{display:flex;flex-direction:column;gap:16px}
.sec-item{display:flex;gap:13px;padding-bottom:16px;border-bottom:1px solid #1d1d22;cursor:pointer}
.sec-item:hover .sec-ttl{color:#ff3a3a}
.sec-thumb{width:108px;height:78px;flex-shrink:0;border-radius:5px;background:linear-gradient(150deg,#1e0808,#0e0303);border:1px solid #241010;display:flex;align-items:center;justify-content:center;color:#4a1c1c;overflow:hidden}
.sec-thumb img{width:100%;height:100%;object-fit:cover}
.sec-cat{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:2px;color:#ff3a3a;text-transform:uppercase;margin-bottom:5px}
.sec-ttl{font-family:'Oswald',sans-serif;font-weight:600;font-size:16px;line-height:1.18;color:#f2f2ee;text-transform:uppercase;transition:color .15s}
.sec-time{font-family:'Share Tech Mono',monospace;font-size:10px;color:#5e5e64;margin-top:6px;letter-spacing:1px}

.mais-lidas{background:#101012;border:1px solid #1f1f24;border-radius:8px;padding:14px 16px}
.ml-title{font-family:'Oswald',sans-serif;font-weight:700;font-size:13px;letter-spacing:2px;color:#cc0000;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.ml-item{display:flex;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid #1c1c20}
.ml-item .num{font-family:'Oswald',sans-serif;font-weight:700;font-size:20px;color:#3a3a40;width:20px;flex-shrink:0}
.ml-item .txt{font-family:'Source Serif 4',serif;font-size:13.5px;line-height:1.35;color:#cececa}
.ml-item .txt small,.sw-ml .txt small{display:block;margin-top:3px;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1px;color:#666;text-transform:uppercase}

/* ── FLOATING AD BANNER ────────────────────────────────────────────── */
@keyframes ad-slidein{from{transform:translateY(120%);opacity:0}to{transform:translateY(0);opacity:1}}
#float-ad{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  width:min(680px,calc(100vw - 32px));
  border-radius:10px;overflow:hidden;
  box-shadow:0 8px 40px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06);
  z-index:8000;
  animation:ad-slidein .45s cubic-bezier(.16,1,.3,1) forwards;
  display:none;
}
#float-ad.show{display:block}
.fad-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:5px 12px;
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(4px);
  border-bottom:1px solid rgba(255,255,255,.07);
}
.fad-lbl{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;color:#555;text-transform:uppercase}
.fad-close{
  background:rgba(255,255,255,.07);border:none;color:#aaa;
  font-size:13px;line-height:1;padding:3px 8px;border-radius:4px;
  cursor:pointer;transition:all .15s;font-family:monospace;
}
.fad-close:hover{background:rgba(255,255,255,.15);color:#fff}
/* dark variant (Bar do Joe) */
.fad-dark{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px;
  padding:18px 24px;
  background:radial-gradient(ellipse at 14% 50%,#3d1410 0%,#1e0808 50%,#0e0404 100%);
  cursor:pointer;
}
.fad-dark img{width:88px;height:88px;object-fit:contain;display:block;filter:drop-shadow(0 4px 14px rgba(0,0,0,.7))}
.fad-info{display:flex;flex-direction:column;gap:5px;min-width:0}
.fad-ttl{font-family:'Oswald',sans-serif;font-weight:700;font-size:19px;line-height:1.1;letter-spacing:.5px;color:#f3e7cf;text-transform:uppercase}
.fad-sub{font-family:'Source Serif 4',serif;font-size:13px;line-height:1.4;color:#c9a98a}
.fad-cta{display:inline-block;background:#cc0000;color:#fff;font-family:'Oswald',sans-serif;font-weight:600;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;padding:11px 26px;border-radius:6px;transition:background .15s;white-space:nowrap;flex-shrink:0}
.fad-cta:hover{background:#ff2a2a}
/* light variant (sidebar widget — keeps original look) */
.sw-ad{background:#0f0f11;border:1px solid #1d1d22;border-radius:8px;overflow:hidden}
.sw-ad .fad-bar{border-bottom:1px solid #1d1d22;background:#0a0a0c}
.sw-ad-body{background:linear-gradient(158deg,#f4ece0,#e6d6bf);padding:18px 16px 20px;text-align:center;cursor:pointer}
.sw-ad-body img{width:100px;height:auto;object-fit:contain;display:block;margin:0 auto}
.sw-ad-ttl{font-family:'Oswald',sans-serif;font-weight:700;font-size:16px;letter-spacing:.5px;color:#7a1f17;text-transform:uppercase;margin-top:10px}
.sw-ad-sub{font-family:'Source Serif 4',serif;font-size:12.5px;line-height:1.5;color:#6d4f3a;margin-top:5px}
.sw-ad-cta{display:inline-block;margin-top:12px;background:#7a1f17;color:#f5ece0;font-family:'Oswald',sans-serif;font-weight:600;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;padding:9px 20px;border-radius:5px;transition:background .15s}
.sw-ad-cta:hover{background:#9a2a1f}

.ultimas{max-width:1280px;margin:0 auto;padding:22px 40px 26px}
.sec-hdr{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.sec-ttl-bar{font-family:'Oswald',sans-serif;font-weight:700;font-size:17px;letter-spacing:2px;color:#fff;text-transform:uppercase;border-left:4px solid #cc0000;padding-left:12px}
.sec-line{flex:1;height:1px;background:#1d1d22}
.sec-link{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#7a7a82;text-transform:uppercase;display:flex;align-items:center;gap:6px;transition:color .15s}
.sec-link:hover{color:#ff3a3a}
.cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.ncard{background:#0f0f11;border:1px solid #1d1d22;border-radius:8px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.ncard:hover{border-color:#8b0000}
.ncard .nthumb{height:158px;position:relative;background:linear-gradient(150deg,#1e0808,#0c0202);border-bottom:1px solid #1d1d22;display:flex;align-items:center;justify-content:center;color:#4a1c1c;overflow:hidden}
.ncard .nthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ncard .ntag{position:absolute;top:11px;left:11px;background:#cc0000;color:#fff;font-family:'Oswald',sans-serif;font-weight:600;font-size:10px;letter-spacing:1.5px;padding:3px 9px;border-radius:2px;text-transform:uppercase}
.ncard .nbody{padding:15px 16px 17px}
.ncard .nbody h3{font-family:'Oswald',sans-serif;font-weight:600;font-size:17px;line-height:1.2;color:#f2f2ee;text-transform:uppercase}
.ncard .nbody p{font-family:'Source Serif 4',serif;font-size:13.5px;line-height:1.55;color:#9a9a96;margin-top:9px}
.ncard .nmeta{font-family:'Share Tech Mono',monospace;font-size:10px;color:#5e5e64;margin-top:12px;letter-spacing:1px}

.live-strip{max-width:1280px;margin:0 auto;padding:0 40px 40px}
.live-box{display:flex;align-items:center;gap:20px;background:linear-gradient(120deg,#160404,#0e0303);border:1px solid #2a0a0a;border-radius:10px;padding:16px 22px}
.live-play{width:46px;height:46px;border-radius:9px;background:#cc0000;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 22px rgba(204,0,0,.4);border:none;transition:background .15s}
.live-play:hover{background:#ff2a2a}
.live-play.playing{background:#8b0000}
.live-info{flex:1;min-width:0}
.live-title-row{display:flex;align-items:center;gap:10px}
.live-name{font-family:'Oswald',sans-serif;font-weight:700;font-size:14px;letter-spacing:2px;color:#fff;text-transform:uppercase}
.live-badge{display:flex;align-items:center;gap:6px;background:rgba(204,0,0,.18);border:1px solid #cc0000;border-radius:3px;padding:2px 9px;font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:1.5px;color:#ff3a3a}
.live-badge .dot{width:6px;height:6px;border-radius:50%;background:#ff2a2a;animation:rn-pulse 1.3s infinite}
.live-sub{font-family:'Share Tech Mono',monospace;font-size:11.5px;color:#8a8a8a;margin-top:5px;letter-spacing:.5px}
.waveform{display:flex;align-items:flex-end;gap:3px;height:30px;flex-shrink:0}
.waveform span{width:3px;border-radius:2px;background:#cc0000}
.live-btn{background:#cc0000;border:none;color:#fff;font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;padding:11px 22px;border-radius:6px;flex-shrink:0;transition:background .15s}
.live-btn:hover{background:#ff2a2a}
.global-live-shell{position:sticky;top:0;z-index:7000;background:rgba(8,8,10,.96);border-bottom:1px solid #2a0a0a;box-shadow:0 10px 28px rgba(0,0,0,.42);backdrop-filter:blur(8px)}
.global-live-shell .live-strip{padding:10px 40px;max-width:1280px}
.global-live-shell .live-box{padding:11px 16px;border-radius:8px}
.global-live-shell .live-play{width:38px;height:38px;border-radius:7px}
.global-live-shell .live-name{font-size:13px}
.global-live-shell .live-sub{font-size:10.5px}
.global-live-shell .waveform{height:24px}
.global-live-shell .live-btn{padding:9px 18px;font-size:12px}

.site-footer{background:#0b0b0d;border-top:2px solid #8b0000;padding:30px 40px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.footer-logo{font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;font-style:italic;letter-spacing:1px}
.footer-sub{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:2px;color:#5a5a60;text-transform:uppercase;margin-top:6px}
.footer-copy{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:1.5px;color:#3e3e44;text-transform:uppercase}

.page-head{max-width:1280px;margin:0 auto;padding:30px 40px 8px}
.breadcrumb{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:2px;color:#6a6a70;text-transform:uppercase;margin-bottom:10px}
.page-title{font-family:'Oswald',sans-serif;font-weight:700;font-size:40px;letter-spacing:1px;text-transform:uppercase;color:#fff}
.page-desc{font-family:'Source Serif 4',serif;font-size:15px;color:#9a9a96;margin-top:6px}
.filter-bar{max-width:1280px;margin:0 auto;padding:20px 40px;display:flex;gap:10px;flex-wrap:wrap;border-bottom:1px solid #1a1a1e}
.chip{font-family:'Oswald',sans-serif;font-weight:600;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;padding:8px 16px;border-radius:20px;cursor:pointer;transition:all .15s}
.chip-active{color:#fff;background:#cc0000}
.chip-inactive{color:#b8b8b2;background:#141417;border:1px solid #26262c}
.chip-inactive:hover{border-color:#cc0000;color:#fff}
.news-body{max-width:1280px;margin:0 auto;padding:26px 40px 40px;display:grid;grid-template-columns:1fr 320px;gap:32px}
.news-list{display:flex;flex-direction:column;gap:18px}
.hcard{display:flex;gap:20px;background:#0f0f11;border:1px solid #1d1d22;border-radius:9px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.hcard:hover{border-color:#8b0000}
.hcard .hthumb{width:260px;flex-shrink:0;position:relative;background:linear-gradient(150deg,#2a0707,#0c0202);display:flex;align-items:center;justify-content:center;color:#4a1c1c;overflow:hidden}

  const h={'Content-Type':'application/json'};

  const r=await fetch(p,{method:m,headers:h,body:b?JSON.stringify(b):undefined});

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function mostRead(list){
  return [...(list||[])].sort((a,b)=>((b.views||0)-(a.views||0))||((b.created_at||0)-(a.created_at||0)));
}
function viewsLabel(n){
  const v=Number(n?.views||0);
  return v>0?`<small>${v} leitura${v===1?'':'s'}</small>`:'';

function sanitizeHtml(html){
  const doc=new DOMParser().parseFromString(`<div>${html||''}</div>`,'text/html');
  doc.querySelectorAll('script,iframe,object,embed,form,input,button,textarea,select,link,meta').forEach(el=>el.remove());
  doc.querySelectorAll('*').forEach(el=>{
    [...el.attributes].forEach(a=>{
      const n=a.name.toLowerCase(),v=(a.value||'').trim().toLowerCase();
      if(n.startsWith('on')||v.startsWith('javascript:')||v.startsWith('data:text/html'))el.removeAttribute(a.name);
    });
  });
  return doc.body.firstElementChild.innerHTML;
}

let adDismissed=false;

function showFloatAd(s){
  if(!s||adDismissed)return;
  const el=$('float-ad');if(!el)return;
  el.innerHTML=`
    <div class="fad-bar">
      <span class="fad-lbl">Publicidade</span>
      <button class="fad-close" onclick="dismissAd()" title="Fechar anúncio">✕ Fechar</button>
    </div>
    <div class="fad-dark" onclick="window.open('${esc(s.cta_url||'#')}','_blank')">
      <img src="${esc(s.image_url)}" alt="${esc(s.name)}">
      <div class="fad-info">
        <div class="fad-ttl">${esc(s.name)}</div>
        <div class="fad-sub">${esc(s.tagline)}</div>
      </div>
      <a class="fad-cta" href="${esc(s.cta_url||'#')}" target="_blank" onclick="event.stopPropagation()">${esc(s.cta_text)}</a>
    </div>`;

function dismissAd(){
  adDismissed=true;
  const el=$('float-ad');
  if(el){el.style.transition='transform .3s ease,opacity .3s ease';el.style.transform='translateX(-50%) translateY(120%)';el.style.opacity='0';setTimeout(()=>{el.classList.remove('show');el.style.cssText='';},320);}
}

function buildAdLight(s){
  if(!s)return'';
  return `<div class="sw-ad">

  const cats=['Tudo',...new Set(newsData.map(n=>n.cat))];

  const articleAuthor=id==='ela-foi-embora-sem-saber-2026-06-26'?'Beau Hollister':'Redação Red News';

    : (news.image_url?`<div class="art-hero"><img src="${esc(news.image_url)}" alt="${esc(news.title)}"></div>`:'');

  <div class="art-head"><div class="breadcrumb">Início / ${news.cat==='Crônica'?'Crônicas':'Notícias'}</div><div class="art-kicker"><span class="tag">${esc(news.cat)}</span>${news.label?`<span class="sub">${esc(news.label)}</span>`:''}</div><h1 class="art-h1">${esc(news.title)}</h1>${news.desc?`<p class="art-dek">${esc(news.desc)}</p>`:''}<div class="art-byline"><div class="art-avatar">${articleInitials}</div><div><div class="art-author">${esc(articleAuthor)}</div><div class="art-meta">Red News · ${esc(news.time_str)}</div></div></div></div>

function buildComments(aid,comments){
  const loading=!Array.isArray(comments);
  const count=loading?'...':comments.length;
  const list=loading?'<div class="cmt-loading">Acordando comentários...</div>':renderCommentList(aid,comments);
  return `<div class="cmts-wrap"><div class="cmts-sep"></div><div class="cmts-hdr"><div class="cmts-title-row"><h3>Comentários</h3><span class="cmts-count">${count}</span></div></div><div class="composer"><div class="comp-inner"><div class="comp-av">${I.usr}</div><div class="comp-form"><input class="comp-name" id="cn-${aid}" placeholder="Seu nome ou personagem"><textarea class="comp-text" id="cb-${aid}" placeholder="Comente como seu personagem…" rows="3"></textarea><div class="comp-footer"><button class="comp-submit" onclick="postComment('${aid}')">Publicar</button></div></div></div></div><div id="cl-${aid}">${list}</div></div>`;
}

async function fetchComments(aid){
  let lastErr=null;
  for(let i=0;i<8;i++){
    try{return await api('GET',`/api/comments/${aid}`);}
    catch(e){lastErr=e;await new Promise(r=>setTimeout(r,2000*(i+1)));}
  }
  throw lastErr||new Error('Comentários indisponíveis');
}

async function refreshComments(aid){
  try{
    const cs=await fetchComments(aid);
    const cl=$(`cl-${aid}`);if(cl)cl.innerHTML=renderCommentList(aid,cs);
    const cnt=document.querySelector('.cmts-count');if(cnt)cnt.textContent=cs.length;
  }catch(e){
    const cl=$(`cl-${aid}`);if(cl)cl.innerHTML='<div class="cmt-loading">Comentários demoraram para acordar. Atualize a página em instantes.</div>';
  }
}

function renderCommentList(aid,comments){
  const replies={};
  comments.forEach(c=>{
    if(c.parent_id)(replies[c.parent_id]||(replies[c.parent_id]=[])).push(c);
  });
  Object.values(replies).forEach(list=>list.sort((a,b)=>(a.created_at||0)-(b.created_at||0)));
  return comments.filter(c=>!c.parent_id).sort((a,b)=>(b.created_at||0)-(a.created_at||0)).map(c=>renderComment(aid,c,replies)).join('');
}

function renderComment(aid,c,replies){
  const ini=initials(c.author),bg=avatarBg(c.author);
  const kids=replies[c.id]||[];
  const rh=kids.length?`<div class="cmt-replies">${kids.map(r=>renderComment(aid,r,replies)).join('')}</div>`:'';
  return `<div class="cmt-item" id="cmt-${c.id}"><div class="cmt-av" style="background:${bg}">${ini}</div><div style="flex:1;min-width:0"><div><span class="cmt-author">${esc(c.author)}</span><span class="cmt-time">· ${timeAgo(c.created_at)}</span></div><p class="cmt-body">${esc(c.body)}</p><div class="cmt-actions"><button class="like-btn" onclick="likeComment('${aid}','${c.id}',this)">${I.hrt}${c.likes}</button><button class="reply-btn" onclick="toggleReply('${aid}','${c.id}')">Responder</button></div><div id="rb-${c.id}"></div>${rh}</div></div>`;
}

function toggleReply(aid,cid){
  const box=$(`rb-${cid}`);if(!box)return;
  if(box.innerHTML){box.innerHTML='';return;}
  box.innerHTML=`<div class="reply-box"><div class="reply-row"><input id="rn-${cid}" placeholder="Seu nome"><textarea id="rt-${cid}" placeholder="Escreva sua resposta..."></textarea><button onclick="postComment('${aid}','${cid}')">Responder</button></div></div>`;
  $(`rt-${cid}`)?.focus();
}

async function postComment(aid,parentId=null){
  const author=(parentId?$(`rn-${parentId}`):$(`cn-${aid}`))?.value?.trim();
  const body=(parentId?$(`rt-${parentId}`):$(`cb-${aid}`))?.value?.trim();
  if(!author||!body){toast('Preencha nome e comentário',false);return;}
  try{
    await api('POST',`/api/comments/${aid}`,{author,body,parent_id:parentId});
    if(parentId){
      const box=$(`rb-${parentId}`);if(box)box.innerHTML='';
    }else{
      $(`cn-${aid}`).value='';$(`cb-${aid}`).value='';
    }
    toast(parentId?'Resposta publicada!':'Comentário publicado!');
    try{
      const cs=await fetchComments(aid);
      const cl=$(`cl-${aid}`);if(cl)cl.innerHTML=renderCommentList(aid,cs);
      const cnt=document.querySelector('.cmts-count');if(cnt)cnt.textContent=cs.length;
    }catch(e){
      const cl=$(`cl-${aid}`);if(cl)cl.innerHTML='<div class="cmt-loading">Comentário salvo. Render acordando a lista...</div>';
      setTimeout(()=>refreshComments(aid),3000);
    }
  }catch(e){toast('Não consegui salvar agora. Tente novamente em alguns segundos.',false);}
}

async function likeComment(aid,cid,btn){
  try{await api('POST',`/api/comments/${aid}/${cid}/like`);const m=btn.textContent.match(/\d+/);btn.innerHTML=I.hrt+(m?parseInt(m[0])+1:1);}catch(e){}
}

async function recordArticleView(id){
  if(!id||id==='s1')return;
  const key=`rn_view_${id}`;
  const now=Date.now();
  try{
    const last=Number(localStorage.getItem(key)||0);
    if(now-last<30*60*1000)return;
    localStorage.setItem(key,String(now));
  }catch(e){}
  try{
    await api('POST',`/api/news/${id}/view`);
    const item=newsData.find(n=>n.id===id);
    if(item)item.views=(Number(item.views||0)+1);
  }catch(e){}
}

// ── ROUTING ──────────────────────────────────────────────────────────────────
function showPage(name){
  ['home','noticias','cronicas','article'].forEach(p=>{$(`page-${p}`).style.display=p===name?'block':'none';});
  currentPage=name;window.scrollTo(0,0);
}

function openArticle(id){
  currentArticle=id;showPage('article');renderArticle(id);history.pushState(null,'',`#article-${id}`);
}

async function navigate(hash){
  if(!hash||hash==='#home'||hash==='#'||hash===''){showPage('home');history.replaceState(null,'','#home');}
  else if(hash==='#noticias'){const s=await api('GET','/api/sponsors').catch(()=>({}));renderNoticias(currentFilter,s);showPage('noticias');}
  else if(hash==='#cronicas'){const s=await api('GET','/api/sponsors').catch(()=>({}));renderCronicas(s);showPage('cronicas');}
  else if(hash.startsWith('#article-')){const id=hash.replace('#article-','');showPage('article');renderArticle(id);}
  else if(hash==='#admin'){history.replaceState(null,'','#home');showPage('home');toast('Painel admin desativado por segurança',false);}
  else{showPage('home');}
}

window.addEventListener('popstate',()=>navigate(location.hash));
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#"]');if(!a)return;
  const h=a.getAttribute('href');if(!h)return;
  e.preventDefault();history.pushState(null,'',h);navigate(h);
});
function doSearch(){
  const input=$('search-input');
  currentSearch=input?input.value.trim():'';
  currentFilter=null;
  history.pushState(null,'','#noticias');
  navigate('#noticias');
}

// ── AUDIO ─────────────────────────────────────────────────────────────────────
function getAudioUrl(){
  if(!streamData.url)return'';
  if(location.protocol==='https:'&&streamData.url.startsWith('http://'))return'/api/stream/audio';
  return streamData.url;
}

function togglePlay(){
  if(!streamData.url){toast('Nenhum stream configurado',false);return;}
  const src=getAudioUrl();
  if(!audio||audio.src!==new URL(src,location.href).href)audio=new Audio(src);
  if(isPlaying){
    audio.pause();isPlaying=false;
    const pb=$('play-btn');if(pb){pb.innerHTML=I.play;pb.classList.remove('playing');}
    const lb=$('live-cta');if(lb)lb.textContent='Ouvir';
    const ls=$('live-sub');if(ls)ls.textContent='Clique para ouvir ao vivo';
  }else{
    audio.play().catch(()=>toast('Erro ao reproduzir stream',false));isPlaying=true;
    const pb=$('play-btn');if(pb){pb.innerHTML=I.pause;pb.classList.add('playing');}
    const lb=$('live-cta');if(lb)lb.textContent='Pausar';
    const ls=$('live-sub');if(ls)ls.textContent='Reproduzindo agora…';
  }
}

// ── QUILL INIT ────────────────────────────────────────────────────────────────
let quill=null,editingNewsId=null;
function initQuill(){
  if(quill)return;
  if(typeof Quill==='undefined'){toast('Editor admin indisponível',false);return;}
  quill=new Quill('#quill-editor',{
    theme:'snow',
    placeholder:'Escreva o corpo completo da notícia… use negrito, títulos, imagens embutidas.',
    modules:{toolbar:[
      [{header:[2,3,false]}],
      ['bold','italic','underline','strike'],
      ['blockquote','code-block'],
      [{list:'ordered'},{list:'bullet'}],
      ['link','image'],
      ['clean']
    ]}
  });
}

function previewImg(url){
  const el=$('n-img-preview');if(!el)return;
  if(url&&url.trim()){el.src=url.trim();el.classList.add('show');}
  else{el.src='';el.classList.remove('show');}
}

async function uploadImage(input){
  const file=input.files[0];if(!file)return;
  const status=$('upload-status');
  status.textContent='Enviando…';status.style.display='block';status.style.color='#7a7a82';
  try{
    const fd=new FormData();fd.append('file',file);
    const t=sessionStorage.getItem(TK);
    const r=await fetch('/api/upload',{method:'POST',headers:{Authorization:'Bearer '+t},body:fd});
    const d=await r.json();
    if(!r.ok)throw new Error(d.detail||'Erro');
    $('n-image').value=d.url;
    previewImg(d.url);
    status.textContent='✓ Imagem carregada';status.style.color='#2ec27a';
  }catch(e){
    status.textContent='Erro: '+e.message;status.style.color='#ff3a3a';
  }
  input.value='';
}

function cancelEdit(){
  editingNewsId=null;
  $('edit-badge').classList.remove('show');
  $('cancel-edit-btn').style.display='none';
  $('composer-ttl').textContent='Compor notícia';
  $('publish-btn').textContent='Publicar';
  ['n-cat','n-title','n-desc','n-image','n-time','n-label'].forEach(id=>{const el=$(id);if(el)el.value='';});
  previewImg('');
  if(quill)quill.setContents([]);
  $('n-type').value='item';
}

async function editNews(id){
  const item=newsData.find(n=>n.id===id);if(!item)return;
  initQuill();
  editingNewsId=id;
  $('n-cat').value=item.cat||'';
  $('n-type').value=item.type||'item';
  $('n-label').value=item.label||'';
  $('n-title').value=item.title||'';
  $('n-desc').value=item.desc||'';
  $('n-time').value=item.time_str||'';
  $('n-image').value=item.image_url||'';
  previewImg(item.image_url||'');
  if(quill){
    if(item.body&&item.body.trim().startsWith('<')){quill.root.innerHTML=sanitizeHtml(item.body);}
    else{quill.setText(item.body||'');}
  }
  $('edit-badge').classList.add('show');
  $('cancel-edit-btn').style.display='inline-flex';
  $('composer-ttl').textContent='Editar notícia';
  $('publish-btn').textContent='Salvar edição';
  $('news-sec').scrollIntoView({behavior:'smooth'});
}

// ── ADMIN ─────────────────────────────────────────────────────────────────────
async function openAdmin(){
  if(!ADMIN_PANEL_ENABLED){toast('Painel admin desativado por segurança',false);return;}
  $('admin-overlay').classList.add('open');
  const status=await api('GET','/api/auth/status').catch(()=>({has_password:false}));
  if(!status.has_password){$('setup-form').style.display='block';$('login-form').style.display='none';}
  else{$('setup-form').style.display='none';$('login-form').style.display='block';}
  const token=sessionStorage.getItem(TK);
  if(token){try{await api('GET','/api/news',null,true);showAdminIn();}catch(e){sessionStorage.removeItem(TK);}}
}
function closeAdmin(){$('admin-overlay').classList.remove('open');history.replaceState(null,'','#home');}
function showAdminIn(){
  $('auth-out').style.display='none';$('auth-in').style.display='block';
  $('radio-sec').style.display='block';$('news-sec').style.display='block';$('spon-sec').style.display='block';
  loadAdminNews();loadAdminStream();loadAdminSponsors();
  setTimeout(initQuill,100);
}
async function doSetup(){const pwd=$('setup-pwd').value;try{const r=await api('POST','/api/auth/setup',{password:pwd});sessionStorage.setItem(TK,r.token);toast('Senha criada!');showAdminIn();}catch(e){toast(e.message,false);}}
async function doLogin(){const pwd=$('login-pwd').value;try{const r=await api('POST','/api/auth/login',{password:pwd});sessionStorage.setItem(TK,r.token);toast('Autenticado!');showAdminIn();}catch(e){toast(e.message,false);}}
async function doLogout(){try{await api('POST','/api/auth/logout',null,true);}catch(e){}sessionStorage.removeItem(TK);$('auth-out').style.display='block';$('auth-in').style.display='none';$('radio-sec').style.display='none';$('news-sec').style.display='none';$('spon-sec').style.display='none';}
async function doReset(){if(!confirm('Resetar TUDO?'))return;try{await api('POST','/api/auth/reset',null,true);toast('Reset concluído');doLogout();}catch(e){toast(e.message,false);}}
async function doChangePwd(){const cur=$('cpwd-cur').value,nw=$('cpwd-new').value;try{await api('POST','/api/auth/change',{current_password:cur,new_password:nw},true);toast('Senha alterada!');$('cpwd-cur').value='';$('cpwd-new').value='';}catch(e){toast(e.message,false);}}
async function loadAdminNews(){const list=$('admin-news-list');if(!list)return;try{const news=await api('GET','/api/news');list.innerHTML=news.map(n=>`<div class="ani"><span class="cat-badge">${esc(n.cat)}</span><span class="title">${esc(n.title)}</span><button class="edit" onclick="editNews('${n.id}')" title="Editar">✎</button><button class="del" onclick="deleteNews('${n.id}')" title="Excluir">✕</button></div>`).join('')||'<div style="color:#5e5e64;font-family:Share Tech Mono,monospace;font-size:11px">Nenhuma notícia</div>';}catch(e){}}
async function addNews(){
  const body=quill?quill.root.innerHTML:'';
  const item={type:$('n-type').value,cat:$('n-cat').value,title:$('n-title').value,desc:$('n-desc').value,body,image_url:$('n-image').value,time:$('n-time').value,label:$('n-label').value};
  if(!item.cat||!item.title){toast('Categoria e manchete obrigatórias',false);return;}
  try{
    if(editingNewsId){
      await api('PUT',`/api/news/${editingNewsId}`,{...item,time_str:item.time},true);
      toast('Notícia atualizada!');
    }else{
      await api('POST','/api/news',item,true);
      toast('Notícia publicada!');
    }
    cancelEdit();
    newsData=await api('GET','/api/news');
    loadAdminNews();
    const s=await api('GET','/api/sponsors').catch(()=>({}));
    renderHome(s);
  }catch(e){toast(e.message,false);}
}
async function deleteNews(id){try{await api('DELETE',`/api/news/${id}`,null,true);newsData=await api('GET','/api/news');loadAdminNews();const s=await api('GET','/api/sponsors').catch(()=>({}));renderHome(s);toast('Notícia removida');}catch(e){toast(e.message,false);}}
async function resetNews(){if(!confirm('Restaurar notícias padrão?'))return;try{await api('POST','/api/news/reset',null,true);newsData=await api('GET','/api/news');loadAdminNews();renderHome({});toast('Feed restaurado');}catch(e){toast(e.message,false);}}
async function loadAdminStream(){try{streamData=await api('GET','/api/stream');if($('radio-url'))$('radio-url').value=streamData.url||'';if($('live-toggle'))$('live-toggle').checked=streamData.is_live;}catch(e){}}
async function saveRadio(){const url=$('radio-url').value.trim();try{await api('PUT','/api/stream',{url},true);streamData.url=url;renderGlobalLive();toast('URL salvo!');}catch(e){toast(e.message,false);}}
async function toggleLive(){const v=$('live-toggle').checked;try{await api('PUT','/api/stream',{is_live:v},true);streamData.is_live=v;renderGlobalLive();toast(v?'Transmissão ativa':'Transmissão pausada');}catch(e){toast(e.message,false);}}
function copyBoombox(){const url=$('radio-url').value.trim()||streamData.url;if(!url){toast('Nenhuma URL configurada',false);return;}navigator.clipboard.writeText(url).then(()=>toast('Link copiado!')).catch(()=>toast('Copie: '+url,false));}

async function loadAdminSponsors(){
  const editor=$('spon-editor');if(!editor)return;
  let sponsors={};try{sponsors=await api('GET','/api/sponsors');}catch(e){}
  editor.innerHTML=Object.values(sponsors).map(s=>`<div style="background:#08080a;border:1px solid #1d1d22;border-radius:8px;padding:16px;margin-bottom:14px"><div style="font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:2px;color:#cc0000;text-transform:uppercase;margin-bottom:12px">Slot: ${s.slot}</div><div class="spon-grid"><div><label>Nome</label><input class="ai" id="sp-${s.slot}-name" value="${esc(s.name||'')}"></div><div><label>Tagline</label><input class="ai" id="sp-${s.slot}-tagline" value="${esc(s.tagline||'')}"></div></div><div class="spon-grid"><div><label>Texto botão</label><input class="ai" id="sp-${s.slot}-cta_text" value="${esc(s.cta_text||'')}"></div><div><label>URL destino</label><input class="ai" id="sp-${s.slot}-cta_url" value="${esc(s.cta_url||'')}"></div></div><div class="spon-grid"><div><label>URL imagem</label><input class="ai" id="sp-${s.slot}-image_url" value="${esc(s.image_url||'')}"></div><div><label>Tema</label><select class="asel" id="sp-${s.slot}-theme"><option value="dark" ${s.theme==='dark'?'selected':''}>Escuro</option><option value="light" ${s.theme==='light'?'selected':''}>Claro</option></select></div></div><button class="abtn" onclick="saveSponsor('${s.slot}')">Salvar</button></div>`).join('');
}

async function saveSponsor(slot){const data={name:$(`sp-${slot}-name`)?.value,tagline:$(`sp-${slot}-tagline`)?.value,cta_text:$(`sp-${slot}-cta_text`)?.value,cta_url:$(`sp-${slot}-cta_url`)?.value,image_url:$(`sp-${slot}-image_url`)?.value,theme:$(`sp-${slot}-theme`)?.value};try{await api('PUT',`/api/sponsors/${slot}`,data,true);toast('Anunciante salvo!');}catch(e){toast(e.message,false);}}

// ── INIT ───────────────────────────────────────────────────────────────────────
async function init(){
  try{newsData=await api('GET','/api/news');}catch(e){newsData=[];}
  try{weatherData=await api('GET','/api/weather');}catch(e){}
  try{streamData=await api('GET','/api/stream');}catch(e){}
  renderGlobalLive();
  let sponsors={};try{sponsors=await api('GET','/api/sponsors');}catch(e){}

  renderHome(sponsors);
  renderNoticias(null,sponsors);
  renderCronicas(sponsors);

  const hash=location.hash||'#home';
  navigate(hash);

  setInterval(async()=>{try{weatherData=await api('GET','/api/weather');}catch(e){}},600000);
  setInterval(()=>{const el=$('util-time');if(el)el.textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});},30000);
}
init();
</script>
